# A bateria de browser.
# =============================================================
# Vive SEPARADA do Publicar, e não a cada push, por duas razões:
#
#  1. Depende de uma API externa. A Open-Meteo dá 10 000 pedidos por dia POR
#     IP, e uma corrida completa gasta algumas dezenas. Pendurar cada `git
#     push` numa quota de terceiros é pedir para que um dia o deploy pare sem
#     ter havido defeito nenhum — e o que se passa nesse dia é uma coisa que
#     não se controla nem se corrige.
#
#  2. Demora minutos e abre uma dúzia de Chromes. O Publicar tem de ser rápido,
#     porque é o caminho entre reparar uma coisa e ela estar no ar.
#
# O que corre a cada push continua no Publicar: os testes que não precisam de
# browser, o gerador e as duas fechaduras sobre o `_site/`.
#
# O CÓDIGO DE SAÍDA DIZ TRÊS COISAS, e é isso que torna isto automatizável:
#   0 — mediu e está tudo bem
#   1 — mediu e encontrou defeitos
#   2 — NÃO CONSEGUIU MEDIR (a API não respondeu)
# O 2 não pinta o workflow de vermelho: um alarme que dispara por causa da
# quota de outra pessoa deixa de ser lido ao fim da terceira vez, e a seguir
# ninguém repara no que é a sério. Fica um aviso no resumo.
#
# ARMADILHA DO GITHUB, e é preciso lembrar: em repositórios públicos os
# workflows agendados são DESACTIVADOS ao fim de 60 dias sem commits — e um
# deploy por artefacto não conta como commit. Se isto deixar de correr sem
# ninguém lhe ter tocado, é aí que se olha primeiro.

name: Bateria de browser

on:
  schedule:
    # 06:20 UTC: depois da meia-noite em que a quota da Open-Meteo se repõe, e
    # cedo de mais para competir com o resto do mundo por ela. O minuto não é
    # redondo de propósito — à hora certa o GitHub tem fila.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bateria
  cancel-in-progress: true

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # O Chrome do runner chega: o cdp.py procura-o no PATH e aceita a
      # CHROME_PATH quando não o encontra. Sem dependências de Python — o
      # cliente do DevTools Protocol é biblioteca padrão, de propósito.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: Montar o _site/
        run: node _build/gerar.js

      # A BATERIA VAI PRIMEIRO, e a ordem não é arbitrária. A Open-Meteo
      # limita por MINUTO, e pesa cada pedido pelo número de localizações, de
      # variáveis e de dias: o `testar-praias.js` pede 40 praias com dez
      # variáveis e quatro modelos, o que gasta a janela toda de uma vez. A
      # seguir, o Chrome pedia e levava com um 429 — que chega ao browser como
      # «Failed to fetch», porque a resposta de recusa não traz cabeçalhos CORS
      # e o browser nem consegue ler o código. O Node, esse, vê o 429 e
      # continua a vida: mesma máquina, mesma rede, dois relatos diferentes.
      # Foi isso que me mandou atrás de DNS e de IPv6 durante três corridas.
      # A LISTA DE PRAIAS CONTRA O OSM DE HOJE. Vive aqui e não no Publicar
      # porque vai à rede de terceiros — o Overpass — e porque a resposta certa
      # a um desvio não é travar o deploy: é alguém olhar. A cópia local
      # envelhece em silêncio, e sem isto ninguém dá por ela: em 23 dias já
      # tinha 3 renomeações e uma praia nova por apanhar.
      - name: A lista de praias ainda bate certo com o OpenStreetMap
        continue-on-error: true
        run: |
          set +e
          node _source/actualizar-praias.js --recolher --verificar
          codigo=$?
          set -e
          # O 2 É «NÃO CONSEGUI PERGUNTAR», e não «a lista divergiu».
          # Este passo ganhou o `.catch(morrer)` e passou a poder sair com 2
          # quando o Overpass não responde — e o teste antigo, `!= 0`, dizia
          # nesse caso que a lista tinha divergido do OpenStreetMap. É uma
          # acusação a dados que ninguém chegou a comparar, e manda alguém
          # procurar uma divergência que não existe.
          if [ "$codigo" = "2" ]; then
            echo "::warning::O Overpass não respondeu — a lista não foi comparada."
            echo '⚠️ O Overpass não respondeu; lista por comparar.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$codigo" != "0" ]; then
            echo "::warning::A lista de praias e o OpenStreetMap divergem — ver o registo."
            echo '⚠️ A lista de praias divergiu do OpenStreetMap.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '✅ A lista de praias bate certo com o OpenStreetMap.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # A recolha altera o _source/osm-praias.json; não se commita daqui.
          git checkout -- _source/osm-praias.json || true

      # A LISTA OFICIAL DA APA. É a que diz QUAIS as praias que existem — o
      # OpenStreetMap só diz onde estão e como se chamam. Vive aqui pela mesma
      # razão que o passo do Overpass: vai à rede de terceiros, e a resposta
      # certa a um desvio é alguém olhar, não travar o deploy.
      #
      # A época balnear muda todos os anos e a lista com ela: praias novas,
      # praias que deixam de ser designadas, datas e bandeiras. Sem isto, a
      # cópia envelhece em silêncio — que foi exactamente como o site esteve
      # sem 131 águas balneares oficiais, quatro delas a ilha de Santa Maria
      # inteira, sem nada no projecto capaz de dar por isso.
      - name: A lista de praias tem as águas balneares oficiais
        continue-on-error: true
        run: |
          set +e
          node _source/actualizar-balneares.js --recolher --verificar
          codigo=$?
          set -e
          if [ "$codigo" = "2" ]; then
            echo "::warning::A APA não respondeu — a lista oficial não foi verificada."
            echo '⚠️ A APA não respondeu; lista oficial por verificar.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$codigo" != "0" ]; then
            echo "::warning::A lista de praias divergiu das águas balneares oficiais."
            echo '⚠️ Faltam águas balneares oficiais — ver o registo.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '✅ As 761 águas balneares oficiais estão todas no site.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # A recolha reescreve o ficheiro; não se commita daqui.
          git checkout -- _source/aguas-balneares.json || true

      # UMA SEGUNDA TENTATIVA, e só quando a primeira DESISTIU DEPRESSA.
      # A Open-Meteo limita por MINUTO e por DIA. O limite do minuto cura-se a
      # esperar; o do dia não.
      #
      # A primeira versão desta condição era só «código 2», e estava errada: o
      # verificar.py sai com 2 sempre que houve um `semMedida()` e nenhum
      # `erro()` — e isso pode acontecer no FIM de uma corrida completa, com
      # uma única secção por medir. Repetir aí não é «custa um minuto»: é
      # correr outra vez os 14 minutos todos, o que com o `sleep 60` pelo meio
      # passa dos 30 do `timeout-minutes` e mata o job — perdendo também os
      # passos que vinham a seguir.
      #
      # O sinal certo não é o código, é o TEMPO. Uma desistência por falta de
      # API sai em segundos (medido: 87 a 208 s); uma corrida que mediu demora
      # 475 a 856 s. Repete-se só abaixo de 300 s.
      - name: A bateria de browser
        id: bateria
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          t0=$SECONDS
          python3 _source/verificar.py
          codigo=$?
          gastou=$(( SECONDS - t0 ))
          if [ "$codigo" = "2" ] && [ "$gastou" -lt 300 ]; then
            echo "Desistiu em ${gastou}s sem medir — segunda tentativa daqui a 60 s."
            sleep 60
            python3 _source/verificar.py
            codigo=$?
          elif [ "$codigo" = "2" ]; then
            echo "Código 2 ao fim de ${gastou}s: mediu quase tudo e ficou uma secção"
            echo "por medir. Repetir custaria outra corrida inteira — não se repete."
          fi
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" = "2" ]; then
            echo "::warning::A Open-Meteo não respondeu — a bateria não mediu nada."
            echo '⚠️ `verificar.py`: a API não respondeu, nada medido.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$codigo" != "0" ]; then
            echo '❌ `verificar.py` encontrou defeitos — ver o registo acima.' >> "$GITHUB_STEP_SUMMARY"
            exit "$codigo"
          else
            echo '✅ `verificar.py`' >> "$GITHUB_STEP_SUMMARY"
          fi

      # E SÓ DEPOIS DE A JANELA DO MINUTO REPOR. Sem esta pausa, o passo de
      # cima e este disputam a mesma quota e um deles perde.
      - name: Esperar pela janela da Open-Meteo
        if: always()
        run: sleep 75

      - name: O modelo contra praias reais
        id: modelo
        if: always()
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          node _source/testar-praias.js
          codigo=$?
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" = "2" ]; then
            echo "::warning::A Open-Meteo não respondeu — não foi possível medir."
            echo '⚠️ `testar-praias.js`: a API não respondeu, nada medido.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$codigo" != "0" ]; then
            echo '❌ `testar-praias.js` encontrou defeitos.' >> "$GITHUB_STEP_SUMMARY"
            exit "$codigo"
          else
            echo '✅ `testar-praias.js`' >> "$GITHUB_STEP_SUMMARY"
          fi

      # UMA CORRIDA QUE NÃO MEDIU NADA NÃO É UMA CORRIDA VERDE.
      # =============================================================
      # O código 2 não pinta o workflow de vermelho, e por boas razões (ver o
      # cabeçalho). Mas isso deixa um buraco que me apanhou a mim: na lista de
      # corridas do GitHub, uma corrida em que os DOIS medidores desistiram por
      # falta de resposta da API tem exactamente o mesmo visto verde de uma que
      # mediu tudo. Eu li o visto, disse que a bateria tinha passado no runner,
      # e não tinha passado nada — tinha desistido em 87 segundos.
      #
      # Não se pinta de vermelho (continuaria a ser o alarme da quota de outra
      # pessoa), mas escreve-se no topo do resumo, em maiúsculas, que esta
      # corrida não provou coisa nenhuma. E o passo chama-se assim de propósito:
      # é o que aparece na página da corrida.
      - name: Esta corrida mediu alguma coisa?
        if: always()
        run: |
          b='${{ steps.bateria.outputs.codigo }}'
          m='${{ steps.modelo.outputs.codigo }}'
          if [ "$b" = "2" ] && [ "$m" = "2" ]; then
            echo "::warning::ESTA CORRIDA NÃO MEDIU NADA — a API não respondeu a nenhum dos dois medidores. O visto verde não quer dizer que o site está bem."
            {
              echo '## ⛔ Esta corrida NÃO MEDIU NADA'
              echo 'Os dois medidores desistiram por falta de resposta da Open-Meteo.'
              echo 'O visto verde aqui **não** quer dizer que o site está bem — quer dizer'
              echo 'que ninguém lhe chegou a tocar. Ver a próxima corrida agendada.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # As fotografias SEM TEXTO que o medidor de contraste usou. Um número
      # numa linha de registo não chega para decidir se a falha é real ou do
      # medidor; a imagem que ele viu chega sempre.
      - name: Guardar as provas do contraste
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: contraste
          path: /tmp/contraste
          if-no-files-found: ignore
          retention-days: 7
